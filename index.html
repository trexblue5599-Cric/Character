<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Character</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div class="bg-image"></div>
  <div class="bg-glow"></div>
  <div class="bg-noise"></div>

  <div class="chat-container">
    <header class="chat-header">
      <div class="avatar"></div>
      <div class="header-text">
        <h1>Character Name</h1>
        <span class="status"><i></i> online</span>
      </div>
    </header>

    <div id="chat-box" class="chat-box"></div>

    <form id="chat-form" class="chat-form">
      <input
        id="user-input"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
        required
      />
      <button type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script>
    const SYSTEM_PROMPT = "You are [CHARACTER NAME], [describe personality, tone, background, how they speak].";

    const chatBox = document.getElementById("chat-box");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");

    const history = [{ role: "system", content: SYSTEM_PROMPT }];

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      history.push({ role: "user", content: text });
      input.value = "";

      const thinking = addMessage("", "bot typing");
      thinking.innerHTML = "<span></span><span></span><span></span>";

      try {
        const response = await puter.ai.chat(history, { model: "gpt-4o" });
        const reply = response.message.content[0].text;
        thinking.classList.remove("typing");
        thinking.textContent = reply;
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        thinking.classList.remove("typing");
        thinking.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
