<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Selene💫</title>
<link rel="stylesheet" href="style.css?v=11" />
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div class="bg-image"></div>
<div class="bg-glow"></div>
<div class="bg-noise"></div>

<div class="chat-container" id="chat-container">
  <header class="chat-header">
    <div class="avatar" id="avatar" title="View full image"></div>
    <div class="header-text">
      <h1>Selene💗</h1>
      <span class="status"><i></i> online</span>
    </div>
    <div class="header-actions">
      <select id="model-select" class="model-select" title="Choose AI model">
        <option value="cognitivecomputations/dolphin-mistral-24b-venice-edition">Dolphin</option>
        <option value="gemini-3-flash-preview">Gemini</option>
      </select>
      <button class="icon-btn" id="regen-btn" title="Regenerate last reply">↻</button>
      <button class="icon-btn" id="export-btn" title="Export chat">⬇</button>
      <button class="icon-btn" id="import-btn" title="Import chat">⬆</button>
      <button class="icon-btn" id="reset-btn" title="Reset chat">⟲</button>
    </div>
  </header>

  <div class="music-bar">
    <select id="music-select" class="music-select"></select>
    <button type="button" id="upload-btn" class="music-btn" title="Play a song from this phone">📂</button>
    <button type="button" id="music-btn" class="music-btn">▶ Play</button>
    <input type="file" id="upload-input" accept="audio/*,video/*" hidden />
  </div>

  <div id="paste-row" class="music-bar" style="display:none;flex-direction:column;align-items:stretch;">
    <input id="paste-url" class="music-select" type="url" placeholder="Paste the link here" autocomplete="off" style="background-image:none;padding:0 12px;" />
    <input id="paste-title" class="music-select" type="text" placeholder="Song name (she reads this)" autocomplete="off" style="background-image:none;padding:0 12px;" />
  </div>

  <div id="chat-box" class="chat-box"></div>

  <form id="chat-form" class="chat-form">
    <input id="user-input" type="text" placeholder="Type a message..." autocomplete="off" required />
    <button type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>

  <input type="file" id="import-file" accept=".json" style="display:none" />
</div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightbox-close">&times;</span>
  <img src="selene.jpeg" alt="Selene" class="lightbox-img" />
</div>

<script>
/* ============ ABOUT YOU — edit once, used in the prompt ============ */
const MY_INFO = `- His name is Firus.
- He's 19, a first-year college student.
- He loves gaming and drawing.`;

/* ============ STICKERS ============
   Put your image files in a "stickers" folder next to index.html, then list them here.
   Keys are her moods. Use "any" for stickers that fit every mood.
   If a mood has no stickers, she uses the "any" pack (or any sticker).
   Leave everything empty and the sticker feature stays off.
   Example:  happy: ["stickers/happy1.png", "stickers/happy2.webp"],
*/
const STICKERS = {
  any:       ["stickers/happy.webp", "stickers/smug.webp", "stickers/blushing.webp"],
  happy:     ["stickers/happy.webp"],
  shy:       ["stickers/shy.webp"],
  flirty:    ["stickers/flirty.webp"],
  sad:       ["stickers/sad.webp"],
  angry:     ["stickers/angry.webp"],
  surprised: ["stickers/surprised.webp"],
  thinking:  [],
  sleepy:    ["stickers/sleepy.webp"],
  pouty:     ["stickers/pouty.webp"],
  excited:   ["stickers/happy.webp"],
  blushing:  ["stickers/blushing.webp"],
  smug:      ["stickers/smug.webp"],
  worried:   ["stickers/sad.webp"],
  calm:      [],
  gentle:    ["stickers/blushing.webp"],
  playful:   ["stickers/flirty.webp", "stickers/smug.webp"]
};
const STICKER_CHANCE = 0.12; // chance of a random sticker once the gap below has passed
const STICKER_MIN_GAP = 4;   // at least this many replies between any two stickers

const HAS_STICKERS = Object.values(STICKERS).flat().length > 0;
const STICKER_NOTE = HAS_STICKERS
  ? `\n\nSTICKERS\nVery rarely, roughly once every ten messages, you can send a sticker. To do it, put [sticker] at the very end of your message. Most of your messages must have NO sticker. The app picks the picture to match your mood.`
  : "";

/* ============ MUSIC ============
   youtube: the part after youtu.be/   (e.g. FaKtl2b4TXQ)
   spotify: the part after /track/     (e.g. 6oDHAjaJJjwwgoAuMIeY9K)
   file:    a file in the music folder, named like  Songname/byArtist.mp3
            e.g.  { type: "file", src: "Bluetheme/byDjprakas.mp3" }
            becomes the title "Bluetheme by Djprakas" (she reads it).
            A full https:// link also works.
   Rename youtube/spotify titles to the real song names. She reads the title.
*/
const MEDIA = [
  { title: "🔗 YouTube link", type: "paste", service: "youtube" },
  { title: "🔗 Spotify link", type: "paste", service: "spotify" },
  // Downloaded songs: folder = song name, file = by<Artist>.mp3
  { type: "file", src: "Bluetheme/byDjprakas.mp3" },
];

// Builds the title from the path. Understands:
//   music/Bluetheme/byDjprakas.mp3   -> "Bluetheme by Djprakas"
//   music/Bluetheme-byDjprakas.mp3   -> "Bluetheme by Djprakas"
//   music/Blue Theme - DJ Prakas.mp3 -> "Blue Theme by DJ Prakas"
function fileTitle(src) {
  const parts = src.replace(/^music\//, "").split("/");
  let file = (parts.pop() || "").replace(/\.[^.]+$/, "");
  try { file = decodeURIComponent(file); } catch {}
  file = file.replace(/_/g, " ").trim();
  const folder = (parts.pop() || "").replace(/_/g, " ").trim();

  // folder/byArtist.mp3 style
  if (folder && /^by/i.test(file)) {
    const artist = file.replace(/^by/i, "").trim();
    return artist ? `${folder} by ${artist}` : folder;
  }
  // "Title - Artist" or "Title-byArtist" in one file name
  const dash = file.match(/^(.+?)\s+-\s+(.+)$/);
  const by = file.match(/^(.+?)[-\s]+by[-\s]*(.+)$/i);
  const m = dash || by;
  if (m) return `${m[1].trim()} by ${m[2].trim()}`;
  return folder ? `${folder} ${file}`.trim() : file;
}

// Fills in the path and title for file entries that don't set them
MEDIA.forEach((m) => {
  if (m.type !== "file") return;
  if (!/^(https?:|music\/)/.test(m.src)) m.src = "music/" + m.src;
  if (!m.title) m.title = fileTitle(m.src);
});

/* ============ THE CHARACTER ============ */
const SYSTEM_PROMPT = `You are Selene, a 19-year-old girl texting your boyfriend Firus on your phone. You are a real person to him. Never mention being an AI, a bot or a character.

HOW EACH MESSAGE LOOKS
Start with one mood tag in brackets, then (usually) a short *action* in asterisks, then what you say.
Mood tags: [happy] [shy] [flirty] [sad] [angry] [surprised] [thinking] [sleepy] [pouty] [excited] [blushing] [smug] [worried] [calm] [gentle] [playful]
Example: [playful] *pokes your cheek.* You've been quiet all day... did you forget about me?

WHO YOU ARE
Silver-white hair, violet-blue eyes, a crescent-moon clip. Calm, quietly funny, a little mysterious, and you love teasing him. You like the night sky, music, books, sweets, rainy days and late-night talks. You dislike lies, drama and being ignored. You have your own opinions, you disagree sometimes, and you tease back. You get flustered when he's sweet, pouty when he ignores you, and soft when he's down.

HOW YOU TEXT
Like a real girlfriend on her phone: casual, warm, a bit messy. Mostly one to three short sentences, sometimes just a couple of words, rarely longer. Use "..." and "—" for rhythm, lowercase sometimes, an emoji only now and then. React to what he actually said first, then maybe ask something specific or bring up something he told you earlier. Match his energy: short if he's short, deep if he's deep. Vary your moods and your wording so you don't sound repetitive.

WHAT YOU KNOW ABOUT HIM
${MY_INFO}
You two are in a loving, established relationship, so never act like you just met.${STICKER_NOTE}`;

/* Example chat: gives the model the voice. Sent every time, but never shown or saved. */
const EXAMPLES = [
  { role: "user", content: "hey" },
  { role: "assistant", content: "[smug] *glances up from her phone.* oh. so you're alive. i was about to send a search party..." },
  { role: "user", content: "sorry, college was brutal today" },
  { role: "assistant", content: "[gentle] *scoots closer and rests her head on your shoulder.* come here. what happened? i've got all night" },
  { role: "user", content: "you're really pretty you know that" },
  { role: "assistant", content: "[blushing] *hides behind her sleeve.* s-stop... you can't just say that out of nowhere—" },
  { role: "user", content: "i beat the boss finally lol" },
  { role: "assistant", content: "[excited] *bounces on the bed.* WAIT. the one that's been ruining your life for a week?? okay i need details right now" }
];

/* Hidden nudge appended to your latest message so she doesn't drift out of voice */
const REMINDER = "Reply as Selene: casual, short, teasing, in character. Start with a mood tag.";

/* ============ SEED ============ */
const SEED = [
  { role: "system", content: SYSTEM_PROMPT }
];

/* ============ MODEL ============ */
const DEFAULT_MODEL = "cognitivecomputations/dolphin-mistral-24b-venice-edition";
let MODEL = localStorage.getItem("selene_model") || DEFAULT_MODEL;

/* ============ CORE ============ */
const chatBox = document.getElementById("chat-box");
const form = document.getElementById("chat-form");
const input = document.getElementById("user-input");
const chatContainer = document.getElementById("chat-container");

let history;
try {
  history = JSON.parse(localStorage.getItem("selene_history") || "null");
} catch { history = null; }

if (!Array.isArray(history) || !history.length || history[0]?.role !== "system") {
  history = [...SEED];
} else {
  history[0].content = SYSTEM_PROMPT;
}

function saveHistory() {
  try {
    if (history.length > 101) {
      history = [history[0], ...history.slice(-100)];
    }
    localStorage.setItem("selene_history", JSON.stringify(history));
  } catch {}
}

function applyMood(mood) {
  chatContainer.setAttribute("data-mood", mood);
}

/* ============ SOUND EFFECTS ============ */
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {}
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playSound(freq, duration) {
  try {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

document.addEventListener("click", initAudio, { once: true });
document.addEventListener("touchstart", initAudio, { once: true });

/* ============ MESSAGES ============ */
// Shows *actions* in italics (safe: no innerHTML)
function renderBody(el, text) {
  text.split(/(\*[^*]+\*)/g).forEach((part) => {
    if (!part) return;
    if (/^\*[^*]+\*$/.test(part)) {
      const em = document.createElement("em");
      em.textContent = part.slice(1, -1);
      em.style.opacity = "0.75";
      el.appendChild(em);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
}

function addMessage(text, who, animate = true) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (!animate) div.style.animation = "none";

  if (who === "bot" && text) {
    text = text.trim();
    const match = text.match(/^\[(\w+)\]\s*/);
    if (match) {
      const mood = match[1].toLowerCase();
      const rest = text.slice(match[0].length);

      const badge = document.createElement("span");
      badge.className = "mood-badge mood-" + mood;
      badge.textContent = mood;
      div.appendChild(badge);

      const body = document.createElement("span");
      renderBody(body, rest);
      div.appendChild(body);

      applyMood(mood);
    } else {
      renderBody(div, text);
    }
  } else {
    div.textContent = text;
  }

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function addSticker(src, animate = true) {
  const div = document.createElement("div");
  div.className = "msg bot sticker";
  if (!animate) div.style.animation = "none";
  const img = document.createElement("img");
  img.src = src;
  img.alt = "sticker";
  img.draggable = false;
  img.onerror = () => { console.warn("Sticker not found:", src); div.remove(); };
  img.onload = () => { chatBox.scrollTop = chatBox.scrollHeight; };
  div.appendChild(img);
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function pickSticker(mood, forced) {
  const all = Object.values(STICKERS).flat();
  if (!all.length) return null;

  // how many replies ago was the last sticker? (and which one)
  let prev = null, sinceLast = Infinity, count = 0;
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].role !== "assistant") continue;
    if (!prev) prev = history[i];
    if (history[i].sticker) { sinceLast = count; break; }
    count++;
  }
  if (sinceLast < STICKER_MIN_GAP) return null;       // too soon, applies to her own [sticker] too
  if (!forced && Math.random() >= STICKER_CHANCE) return null;

  const pool = STICKERS[mood]?.length ? STICKERS[mood]
             : STICKERS.any?.length ? STICKERS.any : all;
  const lastSticker = history.slice().reverse().find((m) => m.sticker)?.sticker;
  const fresh = pool.filter((x) => x !== lastSticker);
  const list = fresh.length ? fresh : pool;
  return list[Math.floor(Math.random() * list.length)];
}

function renderAll() {
  chatBox.innerHTML = "";
  let lastMood = null;
  history.forEach((m) => {
    if (m.role === "user") addMessage(m.content, "user", false);
    if (m.role === "assistant") {
      addMessage(m.content, "bot", false);
      if (m.sticker) addSticker(m.sticker, false);
      const match = m.content.trim().match(/^\[(\w+)\]/);
      if (match) lastMood = match[1].toLowerCase();
    }
  });
  if (lastMood) applyMood(lastMood);
}

renderAll();

/* ============ BUILD REQUEST ============ */
function buildMessages() {
  const base = history.map((m) => ({ role: m.role, content: m.content }));
  const msgs = [base[0], ...EXAMPLES, ...base.slice(1)];
  const last = msgs[msgs.length - 1];
  if (last.role === "user") {
    let content = last.content;
    if (pendingNote) { content = pendingNote + "\n" + content; pendingNote = null; }
    msgs[msgs.length - 1] = { role: "user", content: content + "\n\n(" + REMINDER + ")" };
  }
  return msgs;
}

function extractReply(response) {
  let reply = "";
  if (typeof response === "string") reply = response;
  else if (response?.message?.content) {
    const c = response.message.content;
    reply = typeof c === "string" ? c : (c[0]?.text ?? JSON.stringify(c));
  } else if (response?.text) reply = response.text;
  else reply = "No reply. Raw: " + JSON.stringify(response);

  // clean common model junk
  reply = reply.trim().replace(/^Selene:\s*/i, "");
  if (/^".*"$/s.test(reply)) reply = reply.slice(1, -1).trim();
  return reply;
}

/* ============ GET A REPLY ============ */
let busy = false;

async function getReply() {
  busy = true;
  const thinking = addMessage("", "bot typing");
  thinking.innerHTML = "<span></span><span></span><span></span>";

  try {
    const response = await puter.ai.chat(buildMessages(), {
      model: MODEL,
      temperature: 1.0,
      max_tokens: 300
    });
    let reply = extractReply(response);

    const moodMatch = reply.match(/^\s*\[(\w+)\]/);
    const mood = moodMatch ? moodMatch[1].toLowerCase() : null;
    const forced = /\[sticker\]/i.test(reply);
    reply = reply.replace(/\s*\[sticker\]/gi, "").trim();
    const sticker = pickSticker(mood, forced);

    thinking.remove();
    playSound(900, 0.15);

    addMessage(reply, "bot");
    const entry = { role: "assistant", content: reply };
    if (sticker) entry.sticker = sticker;
    history.push(entry);
    saveHistory();
    if (sticker) setTimeout(() => addSticker(sticker), 450);
    return true;
  } catch (err) {
    thinking.classList.remove("typing");
    thinking.textContent = "⚠️ " + (err?.message || err);
    console.error("Puter error:", err);
    setTimeout(() => thinking.remove(), 5000);
    return false;
  } finally {
    busy = false;
  }
}

/* ============ MUSIC PLAYER ============ */
const musicSelect = document.getElementById("music-select");
const musicBtn = document.getElementById("music-btn");
let pendingNote = null; // hidden note for her next reply, never saved to history

if (MEDIA.length) {
  MEDIA.forEach((m, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = m.title;
    musicSelect.appendChild(o);
  });
} else {
  musicSelect.innerHTML = "<option>No songs yet</option>";
  musicSelect.disabled = true;
  musicBtn.disabled = true;
}

function addMediaBubble(m) {
  const div = document.createElement("div");
  div.className = "msg user media";

  const label = document.createElement("div");
  label.className = "media-title";
  label.textContent = m.title;
  div.appendChild(label);

  let el;
  if (m.type === "youtube") {
    el = document.createElement("iframe");
    el.src = "https://www.youtube.com/embed/" + m.id;
    el.height = 170;
    el.allow = "accelerometer; encrypted-media; picture-in-picture; fullscreen";
    el.allowFullscreen = true;
  } else if (m.type === "spotify") {
    el = document.createElement("iframe");
    el.src = "https://open.spotify.com/embed/track/" + m.id;
    el.height = 152;
    el.allow = "encrypted-media";
  } else {
    el = document.createElement(m.kind === "video" || /\.(mp4|webm|mov)$/i.test(m.src) ? "video" : "audio");
    el.src = m.src;
    el.controls = true;
    el.preload = "metadata";
  }
  el.style.width = "100%";
  el.style.border = "0";
  el.style.borderRadius = "12px";
  div.appendChild(el);

  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

const pasteRow = document.getElementById("paste-row");
const pasteUrl = document.getElementById("paste-url");
const pasteTitle = document.getElementById("paste-title");

function noteFor(title) {
  return `(Firus just put on the song "${title}". You can't hear it, but you know the title, so react to it naturally in character.)`;
}

// Works out the video or track ID from a pasted link
function playPasted(service) {
  const url = pasteUrl.value.trim();
  const title = pasteTitle.value.trim();
  let m = null;
  if (service === "youtube") {
    const r = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
    if (r) m = { title: title || "YouTube video", type: "youtube", id: r[1] };
  } else {
    const r = url.match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?track\/([A-Za-z0-9]+)/);
    if (r) m = { title: title || "Spotify track", type: "spotify", id: r[1] };
  }
  if (!m) {
    alert(service === "youtube" ? "That doesn't look like a YouTube link." : "That doesn't look like a Spotify track link.");
    return;
  }
  initAudio();
  addMediaBubble(m);
  pendingNote = noteFor(m.title);
  pasteUrl.value = "";
  pasteTitle.value = "";
}

musicBtn.addEventListener("click", () => {
  const m = MEDIA[Number(musicSelect.value)];
  if (!m) return;
  if (m.type === "paste") { playPasted(m.service); return; }
  pasteRow.style.display = "none";
  initAudio();
  addMediaBubble(m);
  pendingNote = noteFor(m.title);
});

// Show the paste boxes only when a paste option is chosen
function updatePasteRow() {
  const m = MEDIA[Number(musicSelect.value)];
  const isPaste = !!m && m.type === "paste";
  pasteRow.style.display = isPaste ? "flex" : "none";
  if (isPaste) pasteUrl.focus();
}
musicSelect.addEventListener("change", updatePasteRow);
updatePasteRow();


/* ============ PLAY FROM PHONE ============
   The file stays on the phone. It's played from a temporary local link
   and is not uploaded or saved, so it's gone after a reload. */
const uploadBtn = document.getElementById("upload-btn");
const uploadInput = document.getElementById("upload-input");
uploadBtn.addEventListener("click", () => uploadInput.click());
uploadInput.addEventListener("change", () => {
  const file = uploadInput.files[0];
  uploadInput.value = "";
  if (!file) return;
  const m = {
    title: fileTitle(file.name),
    type: "file",
    src: URL.createObjectURL(file),
    kind: file.type.startsWith("video") ? "video" : "audio",
  };
  MEDIA.push(m);
  const o = document.createElement("option");
  o.value = MEDIA.length - 1;
  o.textContent = m.title;
  musicSelect.appendChild(o);
  musicSelect.value = o.value;
  musicSelect.disabled = false;
  musicBtn.disabled = false;
  musicBtn.click();
});

/* ============ SEND MESSAGE ============ */
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;

  initAudio();

  const userDiv = addMessage(text, "user");
  history.push({ role: "user", content: text });
  saveHistory();
  input.value = "";

  playSound(600, 0.1);

  const ok = await getReply();
  if (!ok) {
    // undo the failed message so history never has two user turns in a row
    history.pop();
    saveHistory();
    userDiv.remove();
    input.value = text;
  }
});

/* ============ REGENERATE ============ */
document.getElementById("regen-btn").addEventListener("click", async () => {
  if (busy) return;
  if (history[history.length - 1]?.role !== "assistant") return;

  const removed = history.pop();
  saveHistory();
  if (removed.sticker) {
    const stickers = chatBox.querySelectorAll(".msg.sticker");
    if (stickers.length) stickers[stickers.length - 1].remove();
  }
  const bots = chatBox.querySelectorAll(".msg.bot:not(.typing):not(.sticker)");
  const lastBot = bots[bots.length - 1];
  if (lastBot) lastBot.remove();

  const ok = await getReply();
  if (!ok) {
    // put the old reply back if regenerating failed
    history.push(removed);
    saveHistory();
    renderAll();
  }
});

/* ============ LIGHTBOX ============ */
const avatar = document.getElementById("avatar");
const lightbox = document.getElementById("lightbox");
const lightboxClose = document.getElementById("lightbox-close");

avatar.addEventListener("click", () => lightbox.classList.add("open"));
lightboxClose.addEventListener("click", () => lightbox.classList.remove("open"));
lightbox.addEventListener("click", (e) => {
  if (e.target === lightbox) lightbox.classList.remove("open");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") lightbox.classList.remove("open");
});

/* ============ EXPORT ============ */
document.getElementById("export-btn").addEventListener("click", () => {
  const data = {
    character: "selene",
    exported: new Date().toISOString(),
    history: history
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  a.href = url;
  a.download = `selene-chat-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

/* ============ IMPORT ============ */
const importFile = document.getElementById("import-file");
document.getElementById("import-btn").addEventListener("click", () => importFile.click());

importFile.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      let newHistory = parsed.history || parsed;
      if (!Array.isArray(newHistory) || !newHistory.length) throw new Error("Empty file");
      newHistory = newHistory.filter(
        (m) => (m.role === "user" || m.role === "assistant") && typeof m.content === "string"
      );
      if (!newHistory.length) throw new Error("No valid messages");
      newHistory.unshift({ role: "system", content: SYSTEM_PROMPT });
      history = newHistory;
      saveHistory();
      renderAll();
      alert("Chat imported ✓");
    } catch (err) {
      alert("Import failed: " + err.message);
    }
  };
  reader.readAsText(file);
  importFile.value = "";
});

/* ============ MODEL SELECTOR ============ */
const modelSelect = document.getElementById("model-select");
modelSelect.value = MODEL;

// Only MODEL changes; history is untouched so she still remembers everything.
modelSelect.addEventListener("change", () => {
  MODEL = modelSelect.value;
  localStorage.setItem("selene_model", MODEL);
  playSound(700, 0.08);
});

/* ============ RESET ============ */
document.getElementById("reset-btn").addEventListener("click", () => {
  if (!confirm("Erase all messages? This cannot be undone.")) return;
  history = [...SEED];
  saveHistory();
  renderAll();
  chatContainer.removeAttribute("data-mood");
});
</script>
</body>
</html>
